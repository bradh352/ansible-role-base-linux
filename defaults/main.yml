---
# These are defaults and overwritten by host/group vars.
timezone: UTC
ssh_port: 22
ntp_pools: ["0.us.pool.ntp.org", "1.us.pool.ntp.org", "2.us.pool.ntp.org", "3.us.pool.ntp.org"]
os_autoupdate: false
# When false, this role will not start/enable/configure firewalld (for hosts
# that manage their own firewall, e.g. a hand-maintained nftables ruleset).
base_linux_manage_firewalld: true
ssh_password_auth: false
ssh_kbdinteractive_auth: false
disable_hwe: false
host_use_default_ip: false
cpu_governor: "performance"
lsi_reset_workaround: true
base_additional_hosts: []
drop_caches: false
nfs_disable_directory_delegations: true
# auditd disk space handling. Set base_linux_auditd_action_mail_acct to have
# auditd email that address when the audit log partition runs low; unset, the
# warning goes to syslog. When space runs out, rotate (dropping the oldest
# logs) and log disk errors rather than suspending auditing.
# base_linux_auditd_action_mail_acct: ops@example.com
base_linux_auditd_admin_space_left_action: rotate
base_linux_auditd_disk_error_action: syslog
# setuid/setgid commands audited on execution (CIS "privileged" rules). A rule
# is only emitted when the command's directory exists on the host.
base_linux_audit_privileged_cmds:
  - /usr/bin/wall
  - /usr/bin/mount
  - /usr/bin/chage
  - /usr/bin/gpasswd
  - /usr/bin/newgrp
  - /usr/bin/chfn
  - /usr/bin/su
  - /usr/bin/chsh
  - /usr/bin/umount
  - /usr/bin/write
  - /usr/bin/sudo
  - /usr/bin/pkexec
  - /usr/bin/crontab
  - /usr/bin/ssh-agent
  - /usr/bin/passwd
  - /usr/sbin/pam_timestamp_check
  - /usr/sbin/unix_chkpwd
  - /usr/sbin/netreport
  - /usr/sbin/usernetctl
  - /usr/sbin/postdrop
  - /usr/sbin/postqueue
  - /usr/lib/polkit-1/polkit-agent-helper-1
  - /usr/libexec/utempter/utempter
  - /usr/libexec/openssh/ssh-keysign
